name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm run ci:install

      - name: Lint
        run: npm run lint

      - name: Docs readiness
        run: npm run verify:docs

      - name: Unified security platform gate
        run: npm run security:verify && npm run security:test

      - name: Build reproducible security platform artifact
        run: npm run security:artifact

      - name: Upload unsigned local artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-platform-${{ github.sha }}
          path: dist/security-platform/
          retention-days: 14
          if-no-files-found: error

      - name: Test
        run: npm test

  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: chain/go.mod
          cache: true
          cache-dependency-path: chain/go.sum

      - name: Go test
        run: |
          cd chain
          CGO_ENABLED=0 go test ./...
